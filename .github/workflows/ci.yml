name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@1e60f620b9541d93622d84af6a8a42a3ad6b1a2d # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:locks
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=low
